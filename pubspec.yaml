name: zhizn
description: "Жизнь — задачи, расписание, привычки и записи в одном приложении."
publish_to: 'none'

# Номер версии в релизах подставляет сборка GitHub из тега (v1.2.3).
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  sqlite3: ^3.7.1
  path_provider: ^2.1.6
  path: ^1.9.0
  http: ^1.6.0
  crypto: ^3.0.7
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.2
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  file_picker: ^13.1.0
  # Windows
  window_manager: ^0.5.2
  tray_manager: ^0.5.2
  hotkey_manager: ^0.2.3
  desktop_drop: ^0.8.0
  pasteboard: ^0.5.0
  # Android
  receive_sharing_intent: ^1.9.0
  android_intent_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
