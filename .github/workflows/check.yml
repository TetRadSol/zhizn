# Проверка на каждый push: анализ кода и автотесты (разбор дат, повторы, синхронизация).
name: Проверка

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
